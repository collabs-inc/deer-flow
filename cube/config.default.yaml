# Cube single-user profile. Credentials are read from one read-only CLI auth
# file at runtime; no credential value is stored here or in the app checkout.
config_version: 45
models:
  - name: claude-sonnet-4.6
    display_name: Claude Sonnet 4.6 (machine sign-in)
    use: deerflow.models.claude_provider:ClaudeChatModel
    model: claude-sonnet-4-6
    max_tokens: 16384
    supports_thinking: true
    supports_vision: true
tool_groups:
  - name: web
  - name: file:read
  - name: file:write
  - name: bash
tools:
  - name: web_search
    group: web
    use: deerflow.community.ddg_search.tools:web_search_tool
    max_results: 5
  - name: web_fetch
    group: web
    use: deerflow.community.jina_ai.tools:web_fetch_tool
    timeout: 10
  - name: ls
    group: file:read
    use: deerflow.sandbox.tools:ls_tool
  - name: read_file
    group: file:read
    use: deerflow.sandbox.tools:read_file_tool
  - name: write_file
    group: file:write
    use: deerflow.sandbox.tools:write_file_tool
  - name: str_replace
    group: file:write
    use: deerflow.sandbox.tools:str_replace_tool
  - name: bash
    group: bash
    use: deerflow.sandbox.tools:bash_tool
sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  # "Host" here is the private gateway container, not the Cube host.
  allow_host_bash: true
database:
  backend: sqlite
  sqlite_dir: /cube-data/state/data
stream_bridge:
  type: memory
scheduler:
  enabled: true
  max_concurrent_runs: 2
skills:
  path: /cube-data/skills
memory:
  enabled: true
